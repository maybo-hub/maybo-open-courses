<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maybo Open Courses 2027</title>
  <!--
    DATA SOURCE : Google Sheet 1mIFWgE0EoyUT0SENiPVkdlUeduTwMwFnQmM9PSN-uHQ
    REQUIREMENT : Sheet must be "Anyone with the link can view"
                  Share → Change → Anyone with the link → Viewer
    LIVE UPDATES: Page fetches fresh data from the sheet on every load.
                  No changes to this file are needed when the sheet changes.
    GITHUB PAGES: Upload as index.html in a public repo.
                  Repo Settings → Pages → Deploy from branch (main / root).
  -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange:    #dd4405;
      --orange-bg: #fdf1ec;
      --dark:      #2d2c2c;
      --body-text: #212529;
      --muted:     #000000;
      --gray-bg:   #f5f7f6;
      --gray-mid:  #e8e8e8;
      --border:    #d7d8d9;
      --white:     #ffffff;
      --green:     #28a745;
      --green-bg:  #e9f7ed;
    }
    html { font-size: 112.5%; scroll-behavior: smooth; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Lato', Arial, sans-serif; color: var(--body-text); background: var(--white); line-height: 1.6; -webkit-font-smoothing: antialiased; }

    /* ── Top strip ──────────────────────────────────────────── */
    .top-strip { background: var(--gray-bg); border-top: 3px solid var(--orange); border-bottom: 1px solid var(--border); }
    .top-strip-inner { max-width: 1100px; margin: 0 auto; padding: 1rem 2rem; display: flex; align-items: center; gap: 2rem; flex-wrap: wrap; }
    .filter-group { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .filter-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dark); }

    /* ── Layout ─────────────────────────────────────────────── */
    .container { max-width: 1100px; margin: 0 auto; padding: 3.5rem 2rem 5rem; }
    .filter-btn {
      background: var(--white); border: 1px solid var(--border); border-radius: 2px;
      padding: 0.35rem 1rem; font-family: 'Lato', Arial, sans-serif;
      font-size: 0.85rem; font-weight: 700; color: var(--body-text); cursor: pointer;
      transition: border-color 0.12s, color 0.12s, background 0.12s;
    }
    .filter-btn:hover { border-color: var(--orange); color: var(--orange); }
    .filter-btn.active { background: var(--orange); border-color: var(--orange); color: var(--white); }

    /* ── Meta ───────────────────────────────────────────────── */
    .meta-line { font-size: 0.75rem; font-weight: 300; color: var(--muted); text-align: right; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }

    /* ── Section headings ───────────────────────────────────── */
    .section-head { margin: 3rem 0 1.25rem; padding-top: 3rem; border-top: 1px solid var(--border); }
    .section-head:first-child { padding-top: 0; border-top: none; margin-top: 0; }
    .section-eyebrow { display: inline-block; font-size: 1.725rem; font-weight: 700; color: var(--orange); margin-bottom: 0.625rem; }

    /* ── Pathway block ──────────────────────────────────────── */
    .pathway-block { margin-bottom: 1.5rem; }
    .pathway-bar {
      background: var(--dark); border-radius: 4px 4px 0 0;
      padding: 0.65rem 1.25rem; display: flex; align-items: center;
      justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;
    }
    .pw-left { display: flex; align-items: center; gap: 0.85rem; }
    .pw-tag {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--orange); background: rgba(221,68,5,0.18); border-radius: 2px; padding: 0.2rem 0.55rem;
    }
    .pw-location { font-weight: 700; color: var(--white); font-size: 0.9rem; }
    .pw-induction { font-size: 0.78rem; font-weight: 700; color: var(--white); }

    /* ── Tables ─────────────────────────────────────────────── */
    .data-table {
      width: 100%; border-collapse: collapse; background: var(--white);
      border: 1px solid var(--border); border-top: none;
      border-radius: 0 0 4px 4px; font-size: 0.875rem;
    }
    .data-table.standalone { border-top: 1px solid var(--border); border-radius: 4px; }
    .data-table thead th {
      background: var(--gray-bg); color: var(--dark); padding: 0.55rem 1rem; text-align: left;
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    .data-table tbody tr { border-bottom: 1px solid var(--border); }
    .data-table tbody tr:last-child { border-bottom: none; }
    .data-table tbody tr:hover { background: var(--gray-bg); }
    .data-table td { padding: 0.7rem 1rem; vertical-align: middle; }

    .course-cell { display: flex; align-items: center; }
    .course-accent { width: 3px; min-height: 1.1rem; background: var(--orange); border-radius: 2px; flex-shrink: 0; margin-right: 0.75rem; }
    .course-name { font-weight: 700; color: var(--dark); }

    /* ── Badges ─────────────────────────────────────────────── */
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 2px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    .b-initial  { background: var(--orange-bg); color: var(--orange); }
    .b-recert   { background: var(--orange-bg); color: var(--orange); }
    .b-sia      { background: #dbeafe; color: #1d4ed8; }
    .b-status   { background: var(--green-bg); color: var(--green); }
    .b-planned  { background: var(--gray-mid); color: var(--dark); }

    /* ── Places ─────────────────────────────────────────────── */
    .avail   { font-weight: 700; color: var(--green); }
    .limited { font-weight: 700; color: var(--orange); }
    .full    { font-weight: 700; color: #dc3545; }

    /* ── Loading / error ────────────────────────────────────── */
    .state-box { text-align: center; padding: 3.5rem 1rem; }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--orange); border-radius: 50%; animation: spin 0.75s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── CTA strip ──────────────────────────────────────────── */
    .cta-strip {
      background: var(--dark); border-top: 3px solid var(--orange); border-radius: 4px;
      padding: 1.5rem 2rem; margin-top: 3rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    }
    .cta-strip-title { color: var(--white); font-weight: 700; margin-bottom: 0.25rem; }
    .cta-strip p { color: var(--gray-mid); font-size: 0.875rem; font-weight: 300; }
    .cta-btn {
      display: inline-block; background: var(--orange); color: var(--white);
      font-family: 'Lato', Arial, sans-serif; font-weight: 700; font-size: 0.875rem;
      padding: 0.6rem 1.5rem; border-radius: 3px; text-decoration: none; white-space: nowrap;
    }
    .cta-btn:hover { background: #c23d04; }

    .no-data { text-align: center; padding: 2.5rem; font-weight: 300; }

    /* ── Tooltip ────────────────────────────────────────────── */
    #tooltip {
      position: fixed; z-index: 1000; pointer-events: none; display: none;
      background: var(--gray-bg); border: 1px solid var(--border);
      border-top: 3px solid var(--orange); border-radius: 4px;
      padding: 0.75rem 1rem; min-width: 200px;
    }
    .tt-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dark); margin-bottom: 0.15rem; }
    .tt-label + .tt-label { margin-top: 0.6rem; }
    .tt-value { font-size: 0.8125rem; font-weight: 700; color: var(--dark); }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 700px) {
      .top-strip-inner { padding: 1rem; }
      .container { padding: 2rem 1rem 4rem; }
      .data-table { font-size: 0.8rem; }
      .data-table td, .data-table thead th { padding: 0.6rem 0.75rem; }
      .cta-strip { flex-direction: column; align-items: flex-start; }
      .pathway-bar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="top-strip">
  <div class="top-strip-inner">
    <div class="filter-group">
      <span class="filter-label">Year</span>
      <div id="year-filters" style="display:flex;gap:0.5rem;flex-wrap:wrap"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">Location</span>
      <div id="loc-filters" style="display:flex;gap:0.5rem;flex-wrap:wrap"></div>
    </div>
  </div>
</div>

<div class="container">

  <div id="app"><div class="state-box"><div class="spinner"></div><p>Loading schedule…</p></div></div>
  <div id="tooltip"><div class="tt-label">Level</div><div class="tt-value" id="tt-level"></div><div class="tt-label" id="tt-ss-label">Self Study</div><div class="tt-value" id="tt-ss-value"></div></div>
  <div class="meta-line" id="meta"></div>

</div>

<script>
const SHEET_ID = '1mIFWgE0EoyUT0SENiPVkdlUeduTwMwFnQmM9PSN-uHQ';
const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

let allRows = [];
let activeLoc  = 'all';
let activeYear = 'all';

/* ── CSV parser ─────────────────────────────────────────────────────────── */
function parseCSV(raw) {
  raw = raw.replace(/\r/g, '');

  /* Tokenise the whole document so newlines inside quoted cells (e.g. a Level
     value like "Primary & Secondary\n(Level 1)") stay part of the cell rather
     than being mistaken for a new record. */
  const rows = [];
  let cells = [], buf = '', inQ = false;
  const endCell = () => { cells.push(buf.replace(/\s+/g, ' ').trim()); buf = ''; };
  const endRow  = () => { endCell(); rows.push(cells); cells = []; };

  for (let i = 0; i < raw.length; i++) {
    const ch = raw[i];
    if (inQ) {
      if (ch === '"') {
        if (raw[i + 1] === '"') { buf += '"'; i++; }
        else inQ = false;
      } else buf += ch;
    } else if (ch === '"') {
      inQ = true;
    } else if (ch === ',') {
      endCell();
    } else if (ch === '\n') {
      endRow();
    } else {
      buf += ch;
    }
  }
  if (buf.length || cells.length) endRow();

  const headers = (rows[0] || []).map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));
  const col = name => headers.indexOf(name);

  const c = {
    pathway:       col('pathway'),
    course:        col('course'),
    stage:         col('stage'),
    induct:        col('induction'),
    location:      col('location'),
    start:         col('startdate'),
    end:           col('enddate'),
    duration:      col('duration'),
    capacity:      col('capacity'),
    places:        col('placesremaining'),
    status:        col('status'),
    level:         col('level'),
    selfStudy:     col('selfstudy'),
    websiteStatus: col('websitestatus'),
  };

  return rows.slice(1)
    .filter(r => r.some(cell => cell !== ''))
    .map(r => ({
      pathway:       r[c.pathway]       || '',
      course:        r[c.course]        || '',
      stage:         r[c.stage]         || '',
      induct:        r[c.induct]        || '',
      location:      r[c.location]      || '',
      start:         r[c.start]         || '',
      end:           r[c.end]           || '',
      duration:      r[c.duration]      || '',
      capacity:      r[c.capacity]      || '',
      places:        r[c.places]        || '',
      status:        r[c.status]        || '',
      level:         r[c.level]         || '',
      selfStudy:     r[c.selfStudy]     || '',
      websiteStatus: r[c.websiteStatus] || '',
    }))
    .filter(r => r.course.length > 0)
    .filter(r => r.websiteStatus.toLowerCase() === 'published');
}

/* ── Date helpers ───────────────────────────────────────────────────────── */
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function parseDate(s) {
  if (!s) return null;
  const p = s.split(' ')[0].split('/');
  if (p.length !== 3) return null;
  return { d: +p[0], m: +p[1] - 1, y: +p[2] };
}

function fmtDate(s) {
  const p = parseDate(s);
  return p ? `${p.d} ${MON[p.m]} ${p.y}` : s;
}

function fmtRange(s, e) {
  const sd = parseDate(s), ed = parseDate(e);
  if (!sd) return '';
  if (!ed || (sd.d === ed.d && sd.m === ed.m && sd.y === ed.y)) return fmtDate(s);
  if (sd.m === ed.m && sd.y === ed.y) return `${sd.d}–${ed.d} ${MON[sd.m]} ${sd.y}`;
  if (sd.y === ed.y) return `${sd.d} ${MON[sd.m]} – ${ed.d} ${MON[ed.m]} ${sd.y}`;
  return `${fmtDate(s)} – ${fmtDate(e)}`;
}

function fmtTime(s) {
  const m = (s.split(' ')[1] || '').match(/^(\d{1,2}):(\d{2})/);
  if (!m) return '';
  let h = +m[1]; const min = +m[2];
  const ampm = h < 12 ? 'am' : 'pm';
  h = h % 12; if (h === 0) h = 12;
  return min === 0 ? `${h}${ampm}` : `${h}:${String(min).padStart(2, '0')}${ampm}`;
}

function fmtInduction(s) {
  const p = parseDate(s);
  if (!p) return '';
  const time = fmtTime(s);
  return `Online induction: ${p.d} ${MON[p.m]} ${p.y}${time ? `, ${time}` : ''}`;
}

/* A row whose Course is "Induction" carries only the pathway induction date/time;
   it should populate the charcoal bar, never appear as a table row. */
function isInduction(r) {
  return (r.course || '').trim().toLowerCase() === 'induction';
}

/* ── HTML helpers ───────────────────────────────────────────────────────── */
function stageBadge(stage) {
  const s = (stage || '').toLowerCase();
  if (s === 'initial') return `<span class="badge b-initial">Initial</span>`;
  if (s === 'recert')  return `<span class="badge b-recert">Recert</span>`;
  if (s === 'sia')     return `<span class="badge b-sia">SIA</span>`;
  return `<span class="badge b-recert">${stage}</span>`;
}

function placesHtml(places, capacity) {
  const p = parseInt(places), c = parseInt(capacity);
  if (isNaN(p)) return places || '—';
  if (p === 0) return `<span class="full">Full</span>`;
  const cls = (!isNaN(c) && p / c <= 0.25) ? 'limited' : 'avail';
  return `<span class="${cls}">${p}</span>`;
}

function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

function statusBadge(status) {
  if (!status) return '—';
  const cls = status.toLowerCase() === 'planned' ? 'b-planned' : 'b-status';
  return `<span class="badge ${cls}">${status}</span>`;
}

function courseRow(r, showLoc) {
  const dur = r.duration ? r.duration + (parseInt(r.duration) === 1 ? ' day' : ' days') : '—';
  const ss = (r.selfStudy && r.selfStudy !== '-') ? r.selfStudy : '';
  return `<tr data-level="${escAttr(r.level)}" data-ss="${escAttr(ss)}">
    <td><div class="course-cell"><div class="course-accent"></div><span class="course-name">${r.course}</span></div></td>
    ${showLoc ? `<td>${r.location}</td>` : ''}
    <td>${stageBadge(r.stage)}</td>
    <td style="white-space:nowrap">${fmtRange(r.start, r.end)}</td>
    <td style="white-space:nowrap">${dur}</td>
    <td>${placesHtml(r.places, r.capacity)}</td>
    <td>${statusBadge(r.status)}</td>
  </tr>`;
}

/* ── Render ─────────────────────────────────────────────────────────────── */
function render() {
  let data = allRows;
  if (activeYear !== 'all') data = data.filter(r => { const p = parseDate(r.start); return p && p.y === activeYear; });
  if (activeLoc  !== 'all') data = data.filter(r => r.location.toLowerCase() === activeLoc);

  if (!data.length) {
    document.getElementById('app').innerHTML = `<div class="no-data">No courses found for this location.</div>`;
    return;
  }

  /* Induction date/time is keyed off the full (unfiltered) data so the
     pathway bar keeps showing it even when filters hide the induction row. */
  const inductionByPathway = new Map();
  for (const r of allRows) {
    const p = r.pathway.trim();
    if (isInduction(r) && r.induct && /^\d+$/.test(p)) inductionByPathway.set(p, r.induct);
  }

  const pathwayMap = new Map();
  const standalone = [];

  for (const r of data) {
    const p = r.pathway.trim();
    if (/^\d+$/.test(p)) {
      if (!pathwayMap.has(p)) pathwayMap.set(p, []);
      pathwayMap.get(p).push(r);
    } else if (!isInduction(r)) {
      standalone.push(r);
    }
  }

  let html = '';

  /* Numbered pathways */
  if (pathwayMap.size > 0) {
    html += `<div class="section-head"><div class="section-eyebrow">Trainer Development Pathways For New Trainers</div></div>`;

    for (const [pNum, pRows] of [...pathwayMap.entries()].sort((a, b) => +a[0] - +b[0])) {
      const indVal = inductionByPathway.get(pNum);
      const indText = indVal ? fmtInduction(indVal) : '';
      const bodyRows = pRows.filter(r => !isInduction(r));
      if (!bodyRows.length) continue;
      const loc = bodyRows[0].location;

      html += `
      <div class="pathway-block">
        <div class="pathway-bar">
          <div class="pw-left">
            <span class="pw-location">${loc}</span>
          </div>
          ${indText ? `<span class="pw-induction">${indText}</span>` : ''}
        </div>
        <table class="data-table">
          <thead><tr>
            <th>Course</th><th>Stage</th><th>Dates</th><th>Duration</th><th>Places Available</th><th>Status</th>
          </tr></thead>
          <tbody>${bodyRows.map(r => courseRow(r, false)).join('')}</tbody>
        </table>
      </div>`;
    }
  }

  /* Standalone / Recert sessions */
  if (standalone.length > 0) {
    standalone.sort((a, b) => {
      const da = parseDate(a.start), db = parseDate(b.start);
      if (!da || !db) return 0;
      return (da.y * 400 + da.m * 31 + da.d) - (db.y * 400 + db.m * 31 + db.d);
    });

    html += `
    <div class="section-head"><div class="section-eyebrow">Recertification and Specialist</div></div>
    <table class="data-table standalone">
      <thead><tr>
        <th>Course</th><th>Location</th><th>Stage</th><th>Dates</th><th>Duration</th><th>Places Available</th><th>Status</th>
      </tr></thead>
      <tbody>${standalone.map(r => courseRow(r, true)).join('')}</tbody>
    </table>`;
  }

  document.getElementById('app').innerHTML = html;
}

/* ── Filters ────────────────────────────────────────────────────────────── */
function setLocFilter(loc, btn) {
  activeLoc = loc;
  document.querySelectorAll('#loc-filters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setYearFilter(year, btn) {
  activeYear = year;
  document.querySelectorAll('#year-filters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function renderYearFilters(rows) {
  const years = [...new Set(
    rows.map(r => { const p = parseDate(r.start); return p ? p.y : null; })
        .filter(y => y !== null && y >= 2026 && y <= 2030)
  )].sort();

  const container = document.getElementById('year-filters');
  const allBtn = `<button class="filter-btn active" onclick="setYearFilter('all',this)">All</button>`;
  const yearBtns = years.map(y => `<button class="filter-btn" onclick="setYearFilter(${y},this)">${y}</button>`).join('');
  container.innerHTML = allBtn + yearBtns;
}

function renderLocFilters(rows) {
  const locs = [...new Set(
    rows.map(r => r.location.trim()).filter(l => l.length > 0)
  )].sort((a, b) => a.localeCompare(b));

  const container = document.getElementById('loc-filters');
  const allBtn = `<button class="filter-btn active" onclick="setLocFilter('all',this)">All</button>`;
  const locBtns = locs.map(l => {
    const val = l.toLowerCase().replace(/'/g, "\\'");
    return `<button class="filter-btn" onclick="setLocFilter('${val}',this)">${l}</button>`;
  }).join('');
  container.innerHTML = allBtn + locBtns;
}

/* ── Load ───────────────────────────────────────────────────────────────── */
async function load() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    allRows = parseCSV(text);
    renderYearFilters(allRows);
    renderLocFilters(allRows);
    render();
    const now = new Date();
    document.getElementById('meta').textContent =
      `Schedule loaded: ${now.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'long', year:'numeric' })}`;
  } catch (err) {
    document.getElementById('app').innerHTML = `
      <div class="state-box">
        <p>Unable to load the course schedule. Please refresh to try again.</p>
        <p style="margin-top:0.75rem;font-size:0.75rem;font-weight:300;opacity:0.6">${err.message}</p>
      </div>`;
  }
}

/* ── Tooltip ────────────────────────────────────────────────────────────── */
const tooltip   = document.getElementById('tooltip');
const ttLevel   = document.getElementById('tt-level');
const ttSsLabel = document.getElementById('tt-ss-label');
const ttSsValue = document.getElementById('tt-ss-value');

function showTooltip(e, level, ss) {
  ttLevel.textContent = level || '—';
  const hasSs = ss && ss.trim().length > 0;
  ttSsLabel.style.display = hasSs ? '' : 'none';
  ttSsValue.style.display  = hasSs ? '' : 'none';
  if (hasSs) ttSsValue.textContent = ss;
  tooltip.style.display = 'block';
  positionTooltip(e);
}

function positionTooltip(e) {
  const pad = 14;
  const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + tw > window.innerWidth  - 8) x = e.clientX - tw - pad;
  if (y + th > window.innerHeight - 8) y = e.clientY - th - pad;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

function hideTooltip() { tooltip.style.display = 'none'; }

document.getElementById('app').addEventListener('mouseover', function(e) {
  const tr = e.target.closest('tr[data-level]');
  if (!tr) { hideTooltip(); return; }
  showTooltip(e, tr.dataset.level, tr.dataset.ss);
});
document.getElementById('app').addEventListener('mousemove', function(e) {
  if (tooltip.style.display !== 'none') positionTooltip(e);
});
document.getElementById('app').addEventListener('mouseleave', hideTooltip);

/* ── iframe resize (for embedding in maybo.com) ─────────────────────────── */
function sendHeight() { window.parent.postMessage({ iframeHeight: document.body.scrollHeight }, '*'); }
new ResizeObserver(sendHeight).observe(document.body);
window.addEventListener('load', sendHeight);

load();
</script>
